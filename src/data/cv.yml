# 経歴（学歴 / 職歴・研究経験 / 受賞）
#
# 書き方のルール:
#   id      … ファイル内で重複しない文字列。必須。
#   section … education / experience / award のいずれか
#   order   … 数字。大きいほど新しい＝上に表示されます。
#             迷ったら「開始年」を入れておくと自然に並びます（同年は +1 して調整）。
#   detail  … 補足。不要なら行ごと省略可。
# ja / en は両方必須です。
#
# いま experience（職歴・研究経験）と award（受賞）は1件もありません。
# 0件のセクションは見出しごと自動で消えるので、このままでも表示は崩れません。
# インターン・TA・RA・受賞が増えたら、下のテンプレートを参考に追記してください。

